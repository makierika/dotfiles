[opener]
edit = [ { run = 'nvim "$@"', block = true, for = 'unix'} ]
view = [ { run = 'imv-dir "$@"', for = 'unix' } ]
listen = [ { run = 'pw-play "$@"', for = 'unix' } ]
play = [ { run = 'mpv --no-audio --start=0 "$@"', for = 'unix' } ]
read = [ { run = 'zathura "$@"', for = 'unix' } ]

[open]
rules = [
  { url = '*.pdf', use = 'read' },
  { mime = 'text/*', use = 'edit' },
  { mime = "application/*", use = "edit" },
  { mime = 'image/*', use = 'view' },
  { mime = 'audio/*', use = 'listen' },
  { mime = 'video/*', use = 'play' }
]

[tasks]
image_bound = [ 0, 0 ]
